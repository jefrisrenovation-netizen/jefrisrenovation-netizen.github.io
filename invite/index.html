<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Suivi des heures Pro — Convite</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f2f3f5;color:#18181b}header{background:#171717;color:#fff;padding:24px;text-align:center}main{max-width:460px;margin:25px auto;padding:20px;background:white;border-radius:16px}h1{font-size:23px}h2{font-size:21px}button,a.button{display:block;width:100%;padding:15px;margin:14px 0;border:0;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none;text-align:center;background:#c92928;color:#fff}.secondary{background:#e5e7eb!important;color:#171717!important}.muted{color:#666;font-size:14px}#notice{color:#a52b24}.hidden{display:none}</style></head><body><header><h1>Suivi des heures Pro</h1></header><main><h2 id="heading">Convite para entrar na equipe</h2><p id="description"></p><p id="details" class="muted"></p><div id="controls" class="hidden"><a id="store" class="button hidden" href="https://apps.apple.com/app/id6821366454" target="_blank" rel="noopener">Baixar na App Store</a><a id="native" class="button secondary hidden">Abrir aplicativo</a><button id="activate">Ativar acesso no navegador</button><p id="help" class="muted">Ao ativar, você poderá definir sua senha. Se já tiver uma conta, entre com o e-mail do convite.</p></div><form id="passwordForm" class="hidden"><label id="passwordLabel" for="password">Senha</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required style="width:100%;padding:14px;margin:10px 0"><label id="confirmLabel" for="confirmation">Confirmar senha</label><input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required style="width:100%;padding:14px;margin:10px 0"><button id="savePassword">Salvar senha</button></form><p id="notice" role="status"></p></main><script>
const BASE='https://jefrisrenovation-netizen.github.io',URL_API='https://nnrelfuewfhkirgzbwsi.supabase.co/functions/v1/team-access',KEY='sb_publishable_3GY1ZI3m6ZLejVqHGL7Pnw_ZnnViDwb';
const token=new URLSearchParams(location.hash.slice(1)).get('invite');
const lang=navigator.language||'fr',pt=lang.startsWith('pt'),en=lang.startsWith('en');
const txt=(fr,p,e)=>pt?p:en?e:fr;
document.documentElement.lang=lang;document.getElementById('heading').textContent=txt('Invitation à rejoindre l’équipe','Convite para entrar na equipe','Invitation to join the team');
document.getElementById('store').textContent=txt('Télécharger sur l’App Store','Baixar na App Store','Download on the App Store');document.getElementById('native').textContent=txt('Ouvrir l’application','Abrir aplicativo','Open app');document.getElementById('activate').textContent=txt('Activer dans le navigateur','Ativar no navegador','Activate in browser');document.getElementById('help').textContent=txt('Définissez votre mot de passe. Si vous avez déjà un compte, connectez-vous avec l’e-mail de l’invitation.','Defina sua senha. Se já tiver uma conta, entre com o e-mail cadastrado no convite.','Set your password. If you already have an account, sign in with the email registered on the invitation.');
let invitation;
document.getElementById('passwordLabel').textContent=txt('Mot de passe (8 caractères minimum)','Senha (mínimo 8 caracteres)','Password (at least 8 characters)');document.getElementById('confirmLabel').textContent=txt('Confirmer le mot de passe','Confirmar senha','Confirm password');document.getElementById('savePassword').textContent=txt('Enregistrer le mot de passe','Salvar senha','Save password');
async function call(action,payload={}){const response=await fetch(URL_API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({action,token,...payload})});const data=await response.json();if(!response.ok)throw Error(txt('Invitation indisponible ou expirée. Demandez un nouveau lien.','Convite indisponível ou expirado. Peça um novo link.','Invite unavailable or expired. Request a new link.'));return data}
async function load(){try{if(!/^[a-f0-9]{64}$/.test(token||''))throw Error(txt('Lien invalide','Link inválido','Invalid link'));const data=await call('invite_info');invitation=data;document.getElementById('description').textContent=data.company+' — '+data.name;document.getElementById('details').textContent=txt('Identifiant : ','Usuário: ','Username: ')+data.username;document.getElementById('controls').classList.remove('hidden');if(data.login_method==='phone'){document.getElementById('help').textContent=txt('Définissez votre mot de passe puis connectez-vous avec votre identifiant ou téléphone. Aucun e-mail nécessaire.','Defina sua senha e entre com seu usuário ou telefone. Não precisa de e-mail.','Set your password, then sign in with your username or phone. No email needed.');if(data.purpose==='reset')document.getElementById('heading').textContent=txt('Définir un nouveau mot de passe','Definir nova senha','Set a new password');}if(/iPhone|iPad|iPod/.test(navigator.userAgent)){document.getElementById('store').classList.remove('hidden');document.getElementById('native').classList.remove('hidden');document.getElementById('native').href='suiviheurespro://invite?token='+encodeURIComponent(token);}}catch(error){document.getElementById('notice').textContent=error.message}}
document.getElementById('activate').onclick=async function(){this.disabled=true;try{if(invitation.login_method==='phone'){document.getElementById('passwordForm').classList.remove('hidden');this.classList.add('hidden');document.getElementById('password').focus();return;}sessionStorage.setItem('suivi_invite',token);const data=await call('resolve_invite');if(data.activation_url){sessionStorage.setItem('suivi_new_invite','1');location.assign(data.activation_url);}else location.assign(BASE+'/preview/');}catch(error){document.getElementById('notice').textContent=error.message;this.disabled=false}};document.getElementById('passwordForm').onsubmit=async function(e){e.preventDefault();const notice=document.getElementById('notice');if(document.getElementById('password').value!==document.getElementById('confirmation').value){notice.textContent=txt('Les mots de passe ne correspondent pas.','As senhas não coincidem.','Passwords do not match.');return;}const button=document.getElementById('savePassword');button.disabled=true;try{const result=await call('redeem_phone',{password:document.getElementById('password').value});const auth=result.session;location.replace(BASE+'/preview/#access_token='+encodeURIComponent(auth.access_token)+'&refresh_token='+encodeURIComponent(auth.refresh_token)+'&token_type=bearer&type=signup');}catch(error){notice.textContent=error.message;button.disabled=false}};load();
</script></body></html>
