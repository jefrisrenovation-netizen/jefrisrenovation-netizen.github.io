<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jefris">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jefris Renovation</title>
<style>
:root{--red:#d71920;--dark:#171717;--bg:#f2f3f5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#18181b;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--dark);color:#fff;padding:18px 16px 16px;padding-top:calc(18px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:10px}.brand h1{font-size:20px;margin:0}.brand small{opacity:.75}
main{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
label{font-size:12px;font-weight:700;display:block;margin:4px 0}input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff}
button{background:var(--red);color:#fff;border:0;font-weight:700}.secondary{background:#e5e7eb;color:#18181b}.danger{background:#b91c1c}
h2{font-size:18px;margin:0 0 4px}.muted{color:#6b7280;font-size:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{font-size:12px;background:#fafafa}.total{font-size:20px;font-weight:800;text-align:right;margin-top:12px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.install{background:#fff1f2;border:1px solid #fecdd3;color:#991b1b}
</style>
</head>
<body>
<header>
 <div class="brand">
  <img src="jefris-logo.jpeg" alt="Jefris Renovation">
  <div><h1>Jefris Renovation</h1><small>Controle de Horas</small></div>
 </div>
</header>
<main>
<section class="card">
 <div class="grid">
  <div><label>Funcionário</label><select id="employee"></select></div>
  <div><label>Mês</label><input id="month" type="month"></div>
  <div><label>Novo funcionário</label><input id="newEmployee" placeholder="Nome completo"></div>
  <div><label>&nbsp;</label><button onclick="addEmployee()">Adicionar</button></div>
 </div>
 <div class="actions">
   <button class="install" id="installBtn" style="display:none" onclick="installApp()">＋ Instalar na tela inicial</button>
   <button class="secondary" onclick="window.print()">Imprimir / PDF</button>
 </div>
</section>

<section class="card">
 <h2 id="title">Controle de Horas</h2><div class="muted">Registre cada dia de trabalho. A pausa padrão é de 30 minutos.</div>
 <div class="table">
 <table><thead><tr><th>Data</th><th>Entrada</th><th>Saída</th><th>Pausa (min)</th><th>Horas</th><th>Local de trabalho</th><th></th></tr></thead>
 <tbody id="rows"></tbody></table>
 </div>
 <div class="actions"><button onclick="addRow()">＋ Adicionar dia</button></div>
 <div class="total">Total: <span id="total">0h00</span></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let employees=JSON.parse(localStorage.getItem("jefris.employees")||'["Funcionário 1"]');
let records=JSON.parse(localStorage.getItem("jefris.records")||"{}");
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="block"});
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;$("installBtn").style.display="none"}else{alert("No iPhone: abra esta página no Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.")}}
function key(){return $("employee").value+"|"+$("month").value}
function save(){localStorage.setItem("jefris.employees",JSON.stringify(employees));localStorage.setItem("jefris.records",JSON.stringify(records))}
function fill(){ $("employee").innerHTML=employees.map(e=>`<option>${esc(e)}</option>`).join(""); render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function minutes(a,b,p){if(!a||!b)return 0;let x=a.split(":").map(Number),y=b.split(":").map(Number),m=y[0]*60+y[1]-x[0]*60-x[1];if(m<0)m+=1440;return Math.max(0,m-(+p||0))}
function fmt(m){return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")}
function refreshCalculated(){
 let list=records[key()]||[];
 document.querySelectorAll("#rows tr").forEach((row,i)=>{
   const r=list[i];
   if(r) row.children[4].innerHTML="<b>"+fmt(minutes(r.in,r.out,r.pause))+"</b>";
 });
 $("total").textContent=fmt(list.reduce((s,r)=>s+minutes(r.in,r.out,r.pause),0));
}
function render(){
 let list=records[key()]||[];
 let monthLabel=$("month").value?new Date($("month").value+"-01T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}):"";
 $("title").textContent=($("employee").value||"Funcionário")+(monthLabel?" — "+monthLabel:"");
 $("rows").innerHTML=list.map((r,i)=>`<tr>
 <td><input type="date" value="${r.date||""}" onchange="upd(${i},'date',this.value)"></td>
 <td><input type="time" value="${r.in||""}" onchange="upd(${i},'in',this.value)"></td>
 <td><input type="time" value="${r.out||""}" onchange="upd(${i},'out',this.value)"></td>
 <td><input type="number" min="0" value="${r.pause ?? 30}" onchange="upd(${i},'pause',this.value)"></td>
 <td><b>${fmt(minutes(r.in,r.out,r.pause ?? 30))}</b></td>
 <td><input value="${esc(r.place||"")}" placeholder="Ex.: Bruxelas" onchange="upd(${i},'place',this.value)"></td>
 <td><button class="danger" style="width:auto;padding:8px" onclick="del(${i})">×</button></td></tr>`).join("");
 $("total").textContent=fmt(list.reduce((s,r)=>s+minutes(r.in,r.out,r.pause ?? 30),0));
}
function addEmployee(){let n=$("newEmployee").value.trim();if(!n)return;if(!employees.includes(n))employees.push(n);save();fill();$("employee").value=n;$("newEmployee").value="";render()}
function addRow(){let k=key();records[k]=records[k]||[];records[k].push({date:$("month").value+"-01",in:"",out:"",pause:30,place:""});save();render()}
function upd(i,p,v){records[key()][i][p]=p==='pause'?(v===''?30:Number(v)):v;save();refreshCalculated()}
function del(i){records[key()].splice(i,1);save();render()}
let now=new Date();$("month").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");$("employee").addEventListener("change",render);$("month").addEventListener("change",render);fill();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body></html>
