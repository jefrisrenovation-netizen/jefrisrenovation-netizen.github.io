workflows:
  ios-simulator:
    name: iPhone - compilation de test (simulateur)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Préparer et vérifier le code
        script: |
          cd mobile
          npm ci
          npm run prepare:web
          npm test
          npm run build
          npm run prepare:native -- ios
      - name: Compiler pour le simulateur iPhone
        script: |
          cd mobile
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator
          zip -r App-simulator.zip App.app
    artifacts:
      - mobile/build/Build/Products/Debug-iphonesimulator/App-simulator.zip
  android-debug:
    name: Android - APK de test
    instance_type: linux_x2
    max_build_duration: 40
    environment:
      node: 22
      java: 21
    scripts:
      - name: Préparer et vérifier le code
        script: |
          cd mobile
          npm ci
          npm run prepare:web
          npm test
          npm run build
          npm run prepare:native -- android
      - name: Compiler l’APK Android
        script: |
          cd mobile/android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
